[package]
name = "tarant"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "An async Tarantool client: native iproto, typed end to end, no unsafe"
license = "MIT OR Apache-2.0"
repository = "https://github.com/voilecx/tarant"
documentation = "https://docs.rs/tarant"
readme = "README.md"
keywords = ["tarantool", "database", "client", "async", "iproto"]
categories = ["database", "asynchronous", "api-bindings"]
exclude = [".github/", ".gitignore", "compose.yaml"]

[package.metadata.docs.rs]
all-features = true

[features]
# Conversions between tarant's value types and the ecosystem crates.
uuid = ["dep:uuid"]
rust_decimal = ["dep:rust_decimal"]
time = ["dep:time"]
chrono = ["dep:chrono"]
jiff = ["dep:jiff"]

[dependencies]
bytes = "1.12.1"
chrono = { version = "0.4", default-features = false, optional = true }
futures-core = { version = "0.3.34", default-features = false }
futures-sink = { version = "0.3.34", default-features = false }
jiff = { version = "0.2", optional = true }
rmp = "0.8.14"
rmp-serde = "1.3.0"
rmpv = { version = "1.3.0", features = ["with-serde"] }
rust_decimal = { version = "1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.10.7"
thiserror = "2.0.20"
# 0.3.47 fixes RUSTSEC-2026-0009; it needs Rust 1.88, so this feature does too.
time = { version = "0.3.47", optional = true }
tokio = { version = "1.53.1", features = ["net", "rt", "sync", "time", "io-util", "macros"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
uuid = { version = "1.20.0", features = ["serde"], optional = true }

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# `pub(crate)` in a private module is exactly how this crate is laid out.
redundant_pub_crate = "allow"
# Its suggestions read worse than the `if let` they replace.
option_if_let_else = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
