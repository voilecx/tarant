[package]
name = "tarant"
version = "0.1.0"
description = "An async Tarantool client: native iproto, typed end to end, no unsafe"
keywords = ["tarantool", "database", "client", "async", "iproto"]
categories = ["database", "asynchronous", "api-bindings"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rmp = "0.8.14"
rmp-serde = "1.3.0"
rmpv = { version = "1.3.0", features = ["with-serde"] }
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.10.7"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["net", "rt", "sync", "time", "io-util", "macros"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
uuid = { version = "1.20.0", features = ["serde"], optional = true }

[lints]
workspace = true

[features]
uuid = ["dep:uuid"]

[dev-dependencies]
anyhow = "1.0.104"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "test-util"] }
