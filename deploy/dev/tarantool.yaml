# Tarantool 3.8 for local development (OrbStack Kubernetes).
# One instance, memtx, WAL on an emptyDir — disposable by design.
apiVersion: v1
kind: Namespace
metadata:
  name: tarant
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tarantool-config
  namespace: tarant
data:
  config.yaml: |
    credentials:
      users:
        tarant:
          password: 'tarant'
          roles: [super]
    iproto:
      listen:
        - uri: '0.0.0.0:3301'
    memtx:
      memory: 268435456
    database:
      # Interactive transactions (IPROTO_BEGIN on a stream) need the MVCC
      # transaction manager: without it any yield inside a transaction —
      # which every DML performs — aborts it with TRANSACTION_YIELD.
      use_mvcc_engine: true
    wal:
      dir: /var/lib/tarantool
    snapshot:
      dir: /var/lib/tarantool
    log:
      level: info
    groups:
      dev:
        replicasets:
          dev:
            instances:
              dev:
                database:
                  mode: rw
---
apiVersion: v1
kind: Service
metadata:
  name: tarantool
  namespace: tarant
spec:
  selector:
    app: tarantool
  ports:
    - name: iproto
      port: 3301
      targetPort: 3301
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tarantool
  namespace: tarant
spec:
  serviceName: tarantool
  replicas: 1
  selector:
    matchLabels:
      app: tarantool
  template:
    metadata:
      labels:
        app: tarantool
    spec:
      containers:
        - name: tarantool
          image: tarantool/tarantool:3.8.0
          command: ["tarantool", "--name", "dev", "--config", "/etc/tarantool/config.yaml"]
          workingDir: /var/lib/tarantool
          ports:
            - containerPort: 3301
              name: iproto
          volumeMounts:
            - name: config
              mountPath: /etc/tarantool
              readOnly: true
            - name: data
              mountPath: /var/lib/tarantool
          readinessProbe:
            tcpSocket:
              port: iproto
            periodSeconds: 2
      volumes:
        - name: config
          configMap:
            name: tarantool-config
        - name: data
          emptyDir: {}
